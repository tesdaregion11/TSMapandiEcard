<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RD Tarhata S. Mapandi | E-Business Card</title>
  <meta name="description" content="E-Business Card of RD Tarhata S. Mapandi">

  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: #f0f2f5;
      font-family: system-ui, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #fff;
    }

    a,
    button {
      padding: 8px 12px;
      border-radius: 8px;
      font: inherit;
    }

    a {
      color: #0f3460;
      background: #e8f0fe;
    }

    button {
      border: 0;
      background: #0f3460;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe
    id="business-card"
    title="E-Business Card of RD Tarhata S. Mapandi"
    src="https://script.google.com/macros/s/AKfycbxgl4Ia5eXldbPUuQuAOKqWtN7inTUAABd1POP9ay9ghcryPuVCVYHaoNTMP4iRSQLemA/exec"
    allow="fullscreen; clipboard-write; clipboard-read"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-top-navigation-by-user-activation">
  </iframe>

  <footer>
    <a
      href="https://script.google.com/macros/s/AKfycbxgl4Ia5eXldbPUuQuAOKqWtN7inTUAABd1POP9ay9ghcryPuVCVYHaoNTMP4iRSQLemA/exec"
      target="_blank"
      rel="noopener noreferrer">
      Open card directly
    </a>
    <button id="fullscreen-button" type="button" hidden>Full screen</button>
  </footer>

  <script>
    const fullscreenButton = document.getElementById('fullscreen-button');

    if (document.fullscreenEnabled) {
      fullscreenButton.hidden = false;

      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Could not toggle full screen:', error);
        }
      });

      document.addEventListener('fullscreenchange', () => {
        fullscreenButton.textContent = document.fullscreenElement
          ? 'Exit full screen'
          : 'Full screen';
      });
    }
  </script>
</body>
</html>
